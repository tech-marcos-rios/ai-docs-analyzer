name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api:
    name: API — lint, build, test
    runs-on: ubuntu-latest
    # Todos los tests mockean el repositorio (ver tests/setup.ts) — no hace
    # falta levantar un Postgres real para correr este job.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      AI_PROVIDER: claude
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # El cliente de Prisma no se commitea (está en .gitignore, ver
      # prisma/schema.prisma) — hay que generarlo antes de lint/build/test
      # porque el código le importa tipos y clases desde ahí.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript -> dist/)
        run: npm run build

      - name: Test
        run: npm test

  web:
    name: Web — lint, build
    runs-on: ubuntu-latest
    # Sin tests todavía (ver "Próximos pasos" en el README del proyecto).
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
