name: ai-docs

services:
  db:
    image: postgres:16-alpine
    container_name: ai-docs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ai_docs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ai_docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Contenedor efímero: aplica migraciones pendientes y termina (exit 0).
  # La imagen es la misma que "api" — el Dockerfile define el server como
  # CMD por defecto, y acá lo pisamos con el comando de Prisma.
  migrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/ai_docs"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ai-docs-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5030:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/ai_docs"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_PROVIDER: claude
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: info
      # Caddy corre delante como reverse proxy (ver docs/INFRAESTRUCTURA.md) —
      # confiar en 1 hop para que Express lea el X-Forwarded-For real de
      # Caddy y el rate limiter (y los logs) usen la IP real del visitante
      # en vez de la de Caddy (que sería la misma para todo el mundo).
      TRUST_PROXY_HOPS: 1
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  pgdata:
