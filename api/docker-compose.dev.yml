services:
  db:
    image: postgres:16-alpine
    container_name: ai-docs-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_docs_dev
    ports:
      - "5435:5432"
    volumes:
      - ai_docs_pgdata:/var/lib/postgresql/data

volumes:
  ai_docs_pgdata:
